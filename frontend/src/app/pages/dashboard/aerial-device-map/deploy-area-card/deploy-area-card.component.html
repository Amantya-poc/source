<aside class="deploy-area-card" (click)="$event.stopPropagation()" (pointerdown)="$event.stopPropagation()">
  <header class="deploy-area-card__header">
    <div class="deploy-area-card__heading">
      <span class="deploy-area-card__eyebrow">Deployment</span>
      <h3 class="deploy-area-card__title">Deploy Area</h3>
    </div>
    <button
      type="button"
      class="deploy-area-card__close"
      aria-label="Close"
      pTooltip="Deselect area"
      tooltipPosition="left"
      (click)="closeArea.emit()"
    >
      <i class="pi pi-times" aria-hidden="true"></i>
    </button>
  </header>

  <p class="deploy-area-card__hint">Select a tool to edit the area on the map.</p>

  <div class="deploy-area-card__actions">
    <button
      type="button"
      class="deploy-area-card__action"
      [class.deploy-area-card__action--active]="activeAction === 'move'"
      (click)="moveArea.emit()"
    >
      <i class="pi pi-arrows-alt" aria-hidden="true"></i>
      <span>Move</span>
    </button>
    <button
      type="button"
      class="deploy-area-card__action"
      [class.deploy-area-card__action--active]="activeAction === 'resize'"
      (click)="resizeArea.emit()"
    >
      <i class="pi pi-expand" aria-hidden="true"></i>
      <span>Resize</span>
    </button>
    <button
      type="button"
      class="deploy-area-card__action"
      [class.deploy-area-card__action--active]="activeAction === 'reshape'"
      (click)="reshapeArea.emit()"
    >
      <i class="pi pi-sync" aria-hidden="true"></i>
      <span>Reshape</span>
    </button>
  </div>

  <button type="button" class="deploy-area-card__delete" (click)="deleteArea.emit()">
    <i class="pi pi-trash" aria-hidden="true"></i>
    <span>Delete Area</span>
  </button>
</aside>
