@if (visible) {
  <article class="plan-panel" [class.plan-panel--embedded]="embedded">
    @if (!embedded) {
      <header class="plan-panel__header">
        <h2 class="plan-panel__title">Create Plan</h2>
        <button type="button" class="plan-panel__close" aria-label="Close" (click)="onCancel()">
          <i class="pi pi-times" aria-hidden="true"></i>
        </button>
      </header>
    }

    <form [formGroup]="planForm" class="plan-form">
      <div class="plan-field">
        <label for="plane-name">Plan Name</label>
        <input
          pInputText
          id="plane-name"
          formControlName="planeName"
          placeholder="e.g. ABC Plan"
        />
      </div>

      <div class="plan-field">
        <label for="plane-speed">Speed (Km/Hr)</label>
        <input
          pInputText
          id="plane-speed"
          inputmode="numeric"
          pattern="[0-9]*"
          formControlName="speed"
          (input)="onSpeedInput($event)"
          placeholder="e.g. 200"
        />
      </div>

      <div class="plan-field">
        <label for="starting-date">Start Date &amp; Time</label>
        <p-datepicker
          inputId="starting-date"
          formControlName="startingDate"
          dateFormat="dd/mm/yy"
          [showTime]="true"
          hourFormat="24"
          [showIcon]="true"
          [iconDisplay]="'input'"
          appendTo="body"
          panelStyleClass="plan-datepicker-panel"
          placeholder="Select date & time"
        />
      </div>

      <p-button
        type="button"
        label="Draw Route"
        icon="pi pi-pencil"
        [outlined]="true"
        styleClass="plan-draw-route-btn"
        (onClick)="mapRouteClick.emit()"
      />

      <hr class="plan-divider" />

      <p-button
        type="button"
        label="Create Plan"
        styleClass="plan-panel__create-btn"
        [disabled]="finishDisabled"
        (onClick)="finishClick.emit()"
      />

      <p-button
        type="button"
        label="Clear All Plans"
        severity="danger"
        [outlined]="true"
        styleClass="plan-panel__clear-btn"
        [disabled]="clearAllDisabled"
        (onClick)="clearAllRoutesClick.emit()"
      />
    </form>

    @if (!embedded) {
      <footer class="plan-panel__footer">
        <p-button
          type="button"
          label="Cancel"
          severity="secondary"
          [outlined]="true"
          styleClass="plan-panel__cancel-btn"
          (onClick)="onCancel()"
        />
      </footer>
    }
  </article>
}
